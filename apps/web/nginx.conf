# 링크 스크래퍼(카톡·트위터·디스코드·검색봇)는 JS를 실행하지 않는다. SPA를 그대로
# 주면 index.html의 기본 메타만 읽어 모든 앨범 링크가 똑같은 카드로 보인다.
# 이 UA들만 API의 /og/... 프리렌더로 넘기고, 사람은 평소대로 SPA를 받는다.
map $http_user_agent $is_link_scraper {
  default 0;
  "~*(facebookexternalhit|Facebot|Twitterbot|kakaotalk-scrap|Slackbot|Discordbot|TelegramBot|WhatsApp|LinkedInBot|Pinterest|redditbot|Applebot|SkypeUriPreview|Googlebot|Daumoa|Yeti)" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API proxy: /api/albums -> api:8080/albums (strips /api like the dev proxy)
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 앨범 상세만 프리렌더 대상 — 공유되는 링크가 사실상 여기뿐이다.
  # `if` 안에서 안전하게 쓸 수 있는 건 return/rewrite...last 둘뿐이라 rewrite를 쓴다.
  location ~ ^/albums/[^/]+$ {
    if ($is_link_scraper) {
      rewrite ^/albums/(.+)$ /__og/albums/$1 last;
    }
    try_files $uri /index.html;
  }

  # internal: 위 rewrite로만 진입 가능. 외부에서 /__og/를 직접 때리면 404.
  location /__og/ {
    internal;
    proxy_pass http://api:8080/og/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
